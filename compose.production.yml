services:
  app:
    build: .
    restart: unless-stopped
    environment:
      UHR_PRODUCTION: "1"
      UHR_SECURE_COOKIES: "1"
      UHR_TRUST_PROXY: "1"
      UHR_SITE_DB: /data/site.db
      UHR_TRUSTED_HOSTS: "${UHR_DOMAIN},www.${UHR_DOMAIN}"
      UHR_INTEGRATION_BASE_URL: "${UHR_INTEGRATION_BASE_URL:-}"
    volumes:
      - urbanhr_site_data:/data
    expose:
      - "8787"

  edge:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      UHR_DOMAIN: "${UHR_DOMAIN}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  urbanhr_site_data:
  caddy_data:
  caddy_config:
