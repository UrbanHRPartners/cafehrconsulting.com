AWSTemplateFormatVersion: '2010-09-09'
Description: UrbanHRPartners Consulting enterprise web platform on ECS Fargate, RDS PostgreSQL, CloudFront and WAF.

Parameters:
  ProjectName:
    Type: String
    Default: urbanhrpartners
  DomainName:
    Type: String
    Default: urbanhrpartnersconsulting.com
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
  ImageUri:
    Type: String
    Description: Immutable ECR image URI including tag or digest.
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
  CloudFrontOriginPrefixListId:
    Type: String
    Description: Regional managed prefix list ID for com.amazonaws.global.cloudfront.origin-facing.
  RegionalCertificateArn:
    Type: String
    Description: ACM certificate in this region for the ALB origin.
  CloudFrontCertificateArn:
    Type: String
    Description: ACM certificate in us-east-1 for the apex and www CloudFront aliases.
  IntegrationBaseUrl:
    Type: String
    Default: ''
  DatabaseInstanceClass:
    Type: String
    Default: db.t4g.medium
  DesiredTasks:
    Type: Number
    Default: 2
  MaximumTasks:
    Type: Number
    Default: 8

Resources:
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${ProjectName}/production/postgres'
      GenerateSecretString:
        SecretStringTemplate: '{"username":"urbanhr_admin"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: UrbanHRPartners private database subnets
      SubnetIds: !Ref PrivateSubnetIds

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL access from UrbanHRPartners application only
      VpcId: !Ref VpcId

  ApplicationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Application access from the load balancer only
      VpcId: !Ref VpcId

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS from CloudFront origin-facing network only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourcePrefixListId: !Ref CloudFrontOriginPrefixListId

  DatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DatabaseSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref ApplicationSecurityGroup

  ApplicationIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ApplicationSecurityGroup
      IpProtocol: tcp
      FromPort: 8787
      ToPort: 8787
      SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      DBName: urbanhr
      DBInstanceClass: !Ref DatabaseInstanceClass
      AllocatedStorage: 100
      MaxAllocatedStorage: 1000
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: true
      PubliclyAccessible: false
      BackupRetentionPeriod: 35
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: true
      DeletionProtection: true
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      MasterUsername: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'

  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 7}

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${ProjectName}-production'
      RetentionInDays: 90

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${ProjectName}-production'
      ClusterSettings: [{Name: containerInsights, Value: enabled}]

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadDatabaseSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DatabaseSecret

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: MediaBoundary
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:AbortMultipartUpload]
                Resource: !Sub '${MediaBucket.Arn}/*'

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      Subnets: !Ref PublicSubnetIds
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: 'true'
        - Key: deletion_protection.enabled
          Value: 'true'

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8787
      TargetType: ip
      HealthCheckPath: /api/health
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: !Ref RegionalCertificateArn}]
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref TargetGroup}]

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${ProjectName}-production'
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: website
          Image: !Ref ImageUri
          Essential: true
          PortMappings: [{ContainerPort: 8787, Protocol: tcp}]
          Environment:
            - {Name: UHR_PRODUCTION, Value: '1'}
            - {Name: UHR_SECURE_COOKIES, Value: '1'}
            - {Name: UHR_TRUST_PROXY, Value: '1'}
            - {Name: UHR_TRUSTED_HOSTS, Value: !Sub '${DomainName},www.${DomainName},${LoadBalancer.DNSName}'}
            - {Name: UHR_INTEGRATION_BASE_URL, Value: !Ref IntegrationBaseUrl}
            - {Name: PGHOST, Value: !GetAtt Database.Endpoint.Address}
            - {Name: PGPORT, Value: !GetAtt Database.Endpoint.Port}
            - {Name: PGDATABASE, Value: urbanhr}
            - {Name: PGSSLMODE, Value: require}
            - {Name: UHR_MEDIA_BUCKET, Value: !Ref MediaBucket}
          Secrets:
            - Name: PGUSER
              ValueFrom: !Sub '${DatabaseSecret}:username::'
            - Name: PGPASSWORD
              ValueFrom: !Sub '${DatabaseSecret}:password::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: website
          HealthCheck:
            Command: [CMD-SHELL, "python -c \"import json,urllib.request;assert json.load(urllib.request.urlopen('http://127.0.0.1:8787/api/health',timeout=3))['status']=='ok'\""]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      Cluster: !Ref Cluster
      DesiredCount: !Ref DesiredTasks
      LaunchType: FARGATE
      PlatformVersion: LATEST
      EnableExecuteCommand: false
      DeploymentConfiguration:
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
        MinimumHealthyPercent: 100
        MaximumPercent: 200
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups: [!Ref ApplicationSecurityGroup]
          Subnets: !Ref PrivateSubnetIds
      LoadBalancers:
        - ContainerName: website
          ContainerPort: 8787
          TargetGroupArn: !Ref TargetGroup
      TaskDefinition: !Ref TaskDefinition

  ScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MinCapacity: !Ref DesiredTasks
      MaxCapacity: !Ref MaximumTasks
      ResourceId: !Sub 'service/${Cluster}/${Service.Name}'
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  ScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub '${ProjectName}-requests-per-target'
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 700
        ScaleInCooldown: 180
        ScaleOutCooldown: 60
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Join ['/', [!GetAtt LoadBalancer.LoadBalancerFullName, !GetAtt TargetGroup.TargetGroupFullName]]

  OriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub '${ProjectName}-all-viewer-except-host'
        CookiesConfig: {CookieBehavior: all}
        QueryStringsConfig: {QueryStringBehavior: all}
        HeadersConfig:
          HeaderBehavior: allExcept
          Headers: [host]

  NoCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${ProjectName}-dynamic-no-cache'
        DefaultTTL: 0
        MinTTL: 0
        MaxTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: true
          EnableAcceptEncodingGzip: true
          CookiesConfig: {CookieBehavior: none}
          HeadersConfig: {HeaderBehavior: none}
          QueryStringsConfig: {QueryStringBehavior: none}

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${ProjectName}-global'
      Scope: CLOUDFRONT
      DefaultAction: {Allow: {}}
      VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: urbanhr-global-waf, SampledRequestsEnabled: true}
      Rules:
        - Name: AWSManagedCommon
          Priority: 10
          OverrideAction: {None: {}}
          Statement: {ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesCommonRuleSet}}
          VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: common-rules, SampledRequestsEnabled: true}
        - Name: AWSManagedKnownBadInputs
          Priority: 20
          OverrideAction: {None: {}}
          Statement: {ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet}}
          VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: bad-inputs, SampledRequestsEnabled: true}
        - Name: GlobalRateLimit
          Priority: 30
          Action: {Block: {}}
          Statement: {RateBasedStatement: {AggregateKeyType: IP, Limit: 2000}}
          VisibilityConfig: {CloudWatchMetricsEnabled: true, MetricName: rate-limit, SampledRequestsEnabled: true}

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Aliases: [!Ref DomainName, !Sub 'www.${DomainName}']
        WebACLId: !GetAtt WebAcl.Arn
        Origins:
          - Id: application-load-balancer
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: application-load-balancer
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: !Ref NoCachePolicy
          OriginRequestPolicyId: !Ref OriginRequestPolicy
        ViewerCertificate:
          AcmCertificateArn: !Ref CloudFrontCertificateArn
          MinimumProtocolVersion: TLSv1.2_2021
          SslSupportMethod: sni-only

  ApexRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget: {DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2}

  WwwRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'www.${DomainName}'
      Type: A
      AliasTarget: {DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2}

Outputs:
  PublicUrl: {Value: !Sub 'https://${DomainName}'}
  DistributionDomain: {Value: !GetAtt Distribution.DomainName}
  DatabaseEndpoint: {Value: !GetAtt Database.Endpoint.Address}
  MediaBucketName: {Value: !Ref MediaBucket}
  ClusterName: {Value: !Ref Cluster}
  ServiceName: {Value: !GetAtt Service.Name}
